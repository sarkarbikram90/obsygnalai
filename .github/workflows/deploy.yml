name: Obsygnal CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Linting & Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3018,DL4006,SC2015
          failure-threshold: error

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Configuration & Structure
        run: python src/validate_config.py

      - name: Execute Pytest Test Suite
        run: pytest tests/

  deploy-cloud-run:
    name: Build & Deploy to Cloud Run
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: env.WIF_PROVIDER != ''
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud via Service Account Key
        if: env.WIF_PROVIDER == '' && env.SA_KEY != ''
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        if: env.WIF_PROVIDER != '' || env.SA_KEY != ''
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute Infrastructure & Cloud Run Deployment
        if: env.WIF_PROVIDER != '' || env.SA_KEY != ''
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          chmod +x infra/deploy.sh
          ./infra/deploy.sh
